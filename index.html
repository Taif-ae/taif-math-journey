<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مغامرة الأرقام الذكية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4d6, #dff7ff);
      color: #263238;
      text-align: center;
    }

    header {
      padding: 30px 15px 15px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 20px;
    }

    .characters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .character {
      background: white;
      border-radius: 25px;
      padding: 20px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      transition: transform 0.2s;
    }

    .character:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .character img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 20px;
    }

    .character h2 {
      margin: 12px 0 5px;
      font-size: 24px;
    }

    .speech {
      min-height: 80px;
      max-width: 700px;
      margin: 10px auto 30px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      font-size: 22px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .start-btn {
      border: none;
      background: #ffb703;
      color: #222;
      padding: 15px 35px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }

    .start-btn:hover {
      transform: scale(1.05);
    }

    .talking {
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-12px);
      }
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔢 مغامرة الأرقام الذكية</h1>
    <div class="subtitle">
      اختاري شخصيتج وخلّينا نبدأ المغامرة! 🚀
    </div>
  </header>

  <div class="speech" id="speech">
    اضغطي على أي شخصية عشان تتكلم 🎙️
  </div>

  <section class="characters">

    <div class="character" onclick="talk('hessa', this)">
      <img src="hessa.png" alt="حصة">
      <h2>حصة</h2>
      <p>🌟 الشخصية الذكية</p>
    </div>

    <div class="character" onclick="talk('ahmed', this)">
      <img src="ahmed.png" alt="أحمد">
      <h2>أحمد</h2>
      <p>🧠 يحب التحديات</p>
    </div>

    <div class="character" onclick="talk('maha', this)">
      <img src="maha.png" alt="مها">
      <h2>مها</h2>
      <p>📚 تحب التعلم</p>
    </div>

    <div class="character" onclick="talk('fahem', this)">
      <img src="fahem.png" alt="فاهم">
      <h2>فاهم</h2>
      <p>💡 يعرف الحل</p>
    </div>

    <div class="character" onclick="talk('shahin', this)">
      <img src="shahin.png" alt="شاهين">
      <h2>شاهين</h2>
      <p>🦅 قائد المغامرة</p>
    </div>

  </section>

  <button class="start-btn" onclick="startAdventure()">
    🚀 ابدأ المغامرة
  </button>

  <footer>
    © مغامرة الأرقام الذكية
  </footer>

  <script>

    const characters = {

      hessa: {
        name: "حصة",
        text: "مرحبا! أنا حصة، ويلا نبدأ مغامرة الأرقام الذكية!"
      },

      ahmed: {
        name: "أحمد",
        text: "مرحبا! أنا أحمد، جاهزين للتحدي؟ خلّونا نشوف منو بيحلها أسرع!"
      },

      maha: {
        name: "مها",
        text: "مرحبا! أنا مها، يلا نتعلم ونكتشف الأرقام بطريقة ممتعة!"
      },

      fahem: {
        name: "فاهم",
        text: "أنا فاهم! ركّزوا عدل، لأن كل مسألة لها حل ذكي!"
      },

      shahin: {
        name: "شاهين",
        text: "مرحبا! أنا شاهين، ويلا نقود مغامرتنا ونوصل للهدف!"
      }

    };


    function talk(characterKey, element) {

      const character = characters[characterKey];

      const speechBox = document.getElementById("speech");

      speechBox.textContent =
        character.name + ": " + character.text;

      document.querySelectorAll(".character").forEach(card => {
        card.classList.remove("talking");
      });

      element.classList.add("talking");

      // إيقاف أي كلام سابق
      window.speechSynthesis.cancel();

      // إنشاء الصوت
      const speech = new SpeechSynthesisUtterance(
        character.text
      );

      speech.lang = "ar-AE";
      speech.rate = 0.9;
      speech.pitch = 1.1;
      speech.volume = 1;

      speech.onend = function() {
        element.classList.remove("talking");
      };

      window.speechSynthesis.speak(speech);
    }


    function startAdventure() {

      const speechBox = document.getElementById("speech");

      speechBox.textContent =
        "🎉 يلا! اختاري شخصية عشان نبدأ المغامرة!";

      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(
        "يلا! اختاري شخصية عشان نبدأ المغامرة!"
      );

      speech.lang = "ar-AE";
      speech.rate = 0.9;
      speech.pitch = 1.1;

      window.speechSynthesis.speak(speech);
    }

  </script>

</body>
</html>
