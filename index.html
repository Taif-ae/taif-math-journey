<script>

let score = 0;
let currentText = "";
let currentCharacter = "";

const characters = {

  "حصة":
  "هلا والله! أنا حصة. أحب أتعلم وأعتز بهويتي الإماراتية. يلا نخوض مغامرة الرياضيات ويا بعض!",

  "أحمد":
  "مرحبا الساع! أنا أحمد. اليوم عندنا تحديات رياضية، وأبغي أشوف شطارتك!",

  "مها":
  "هلا! أنا مها. أحب البيئة والرفق، واليوم برحل وياج في مغامرة الأرقام.",

  "فاهم":
  "هلااا! أنا فاهم، المساعد الذكي. خلينا نفكر عدل قبل لا نختار الإجابة! 🤖",

  "شاهين":
  "مرحبا! أنا شاهين. خلّنا نبدأ الرحلة ونوصل للهدف مثل القائد الشاطر!"
};


// البحث عن أفضل صوت عربي متوفر
function getArabicVoice(){

  const voices = speechSynthesis.getVoices();

  // نحاول أولاً إيجاد صوت إماراتي
  let voice = voices.find(v =>
    v.lang &&
    v.lang.toLowerCase() === "ar-ae"
  );

  // إذا ما حصلناه، نستخدم أي صوت عربي
  if(!voice){

    voice = voices.find(v =>
      v.lang &&
      v.lang.toLowerCase().startsWith("ar")
    );

  }

  return voice;
}


// تشغيل كلام الشخصية
function speak(text, name=""){

  if(!("speechSynthesis" in window)){
    alert("الصوت غير مدعوم في هذا المتصفح.");
    return;
  }

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "ar-AE";

  const voice = getArabicVoice();

  if(voice){
    speech.voice = voice;
  }

  // اختلاف بسيط بين الشخصيات
  if(name === "فاهم"){

    speech.rate = 0.85;
    speech.pitch = 1.25;

  }else if(name === "شاهين"){

    speech.rate = 0.9;
    speech.pitch = 0.9;

  }else{

    speech.rate = 0.92;
    speech.pitch = 1;

  }

  speech.volume = 1;

  speechSynthesis.speak(speech);
}


// عند الضغط على الشخصية
function talk(name){

  const box = document.getElementById("talkBox");
  const nameBox = document.getElementById("talkName");
  const textBox = document.getElementById("talkText");

  currentCharacter = name;
  currentText = characters[name];

  nameBox.textContent = name;

  textBox.textContent = currentText;

  box.classList.remove("show");

  setTimeout(() => {

    box.classList.add("show");

    createStars();

    speak(currentText, name);

  },100);

}


// إعادة الكلام
function speakAgain(){

  speak(currentText, currentCharacter);

}


// بداية الرحلة
function startJourney(){

  document.getElementById("characters").scrollIntoView({
    behavior:"smooth"
  });

  speak(
    "هلا والله! حياج في رحلة الأرقام الذكية. اختاري شخصية عشان تتعرفين عليها."
  );

}


// السؤال الرياضي
function checkAnswer(answer){

  const result = document.getElementById("result");

  if(answer === 14){

    score += 10;

    document.getElementById("score").textContent = score;

    result.textContent =
      "🎉 كفو! إجابتج صحيحة. فاهم فخور فيج!";

    result.style.color = "#23733b";

    document.getElementById("progress").style.width = "100%";

    speak(
      "كفو عليج! إجابتج صحيحة. حصلتي عشر نقاط.",
      "فاهم"
    );

    createStars();

  }else{

    result.textContent =
      "💡 مب مشكلة! حاولي مرة ثانية واحسبي الضرب أول.";

    result.style.color = "#7b1e25";

    speak(
      "قريبة! حاولي مرة ثانية واحسبي الضرب أول.",
      "فاهم"
    );

  }

}


// المؤثرات
function createStars(){

  for(let i=0;i<8;i++){

    const star = document.createElement("div");

    star.className = "star";

    star.textContent = "✨";

    star.style.left =
      Math.random()*90 + "%";

    star.style.top =
      50 + Math.random()*30 + "%";

    document.body.appendChild(star);

    setTimeout(()=>{
      star.remove();
    },1000);

  }

}


// تحميل الأصوات
speechSynthesis.onvoiceschanged = function(){

  getArabicVoice();

};

</script>
